<app-topbar />

<div class="page">
  <div class="page-icon">
    <i class="pi pi-lock"></i>
  </div>

  <p-card header="Cambiar contraseña" class="card">
    @if (successMessage()) {
      <p-message severity="success" [text]="successMessage()!" styleClass="w-full mb-3" />
    }
    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" styleClass="w-full mb-3" />
    }

    <form (ngSubmit)="submit()" class="form">
      <div class="field">
        <label for="currentPassword">Contraseña actual</label>
        <p-password
          id="currentPassword"
          [ngModel]="currentPassword()"
          (ngModelChange)="currentPassword.set($event)"
          name="currentPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
      </div>

      <div class="field">
        <label for="newPassword">Nueva contraseña</label>
        <p-password
          id="newPassword"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="new-password"
        />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar nueva contraseña</label>
        <p-password
          id="confirmPassword"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          name="confirmPassword"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="new-password"
        />
      </div>

      <div class="actions">
        <p-button label="Volver" severity="secondary" [text]="true" (onClick)="back()" type="button" />
        <p-button label="Guardar" icon="pi pi-check" type="submit" [loading]="saving()" />
      </div>
    </form>
  </p-card>
</div>
