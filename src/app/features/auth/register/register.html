<div class="auth-page">
  <div class="auth-brand">
    <img src="logo-daewoo.png" alt="Daewoo Perú" class="auth-logo" />
    <p>Control de Asistencia</p>
  </div>

  <p-card class="auth-card" header="Crear cuenta de colaborador">
    <form (ngSubmit)="submit()" class="auth-form">
      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="w-full" />
      }
      @if (successMessage()) {
        <p-message severity="success" [text]="successMessage()!" styleClass="w-full" />
      }

      <div class="field">
        <label for="fullName">Nombre completo</label>
        <input pInputText id="fullName" type="text" [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" name="fullName" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input pInputText id="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password id="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password" />
      </div>

      <p-button type="submit" label="Registrarme" [loading]="loading()" styleClass="w-full" />
    </form>

    <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </p-card>
</div>
