<div class="auth-page">
  <div class="auth-brand">
    <img src="logo-daewoo.png" alt="Daewoo Perú" class="auth-logo" />
    <p>Control de Asistencia</p>
  </div>

  <p-card class="auth-card" header="Iniciar sesión">
    <form (ngSubmit)="submit()" class="auth-form">
      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="w-full" />
      }

      <div class="field">
        <label for="email">Correo</label>
        <input pInputText id="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password id="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" autocomplete="current-password" />
      </div>

      <p-button type="submit" label="Ingresar" [loading]="loading()" styleClass="w-full" />
    </form>

    <p class="switch-link">
      ¿Eres colaborador y aún no tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </p-card>
</div>
