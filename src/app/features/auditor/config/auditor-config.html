<app-topbar />

<div class="config-page">
  <p-card header="Configurar horas requeridas" class="config-card">
    @if (!loading()) {
      @if (successMessage()) {
        <p-message severity="success" [text]="successMessage()!" styleClass="w-full mb-3" />
      }
      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="w-full mb-3" />
      }

      <div class="field">
        <label for="dailyHours">Horas mínimas por día</label>
        <p-inputnumber id="dailyHours" [ngModel]="dailyHours()" (ngModelChange)="dailyHours.set($event)" [min]="0" [max]="24" [step]="0.5" suffix=" h" styleClass="w-full" />
      </div>

      <div class="field">
        <label for="weeklyHours">Horas mínimas por semana</label>
        <p-inputnumber id="weeklyHours" [ngModel]="weeklyHours()" (ngModelChange)="weeklyHours.set($event)" [min]="0" [max]="168" [step]="1" suffix=" h" styleClass="w-full" />
      </div>

      <div class="config-actions">
        <p-button label="Volver" severity="secondary" [text]="true" (onClick)="back()" />
        <p-button label="Guardar" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
      </div>
    }
  </p-card>
</div>
